      fill-opacity="0.45"
    />

    <!-- Stem Line Art -->
    <path
      d="M12 5.5 C12 3.5 12.8 2.3 14 1.8"
      stroke="#D7CCC8"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Leaf Line Art -->
    <path
      d="M13 2.8 C14.5 2 16 2.8 16 4 C15.2 4.8 13.8 4.5 13 2.8 Z"
      stroke="#A5D6A7"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="#81C784"
      fill-opacity="0.4"
    />

    <!-- Spiky Husk Outline (Left Half) -->
    <path
      d="M12 5.5
         Q10.5 6.5 10.5 7.5
         Q9 8 9 9.2
         Q7.5 9.8 7.5 11
         Q6 11.8 6 13
         Q4.5 13.8 4.8 15.2
         Q6 16.5 6.5 17.5
         Q8 18.5 9.5 19.2
         Q11 20 12 20.5"
