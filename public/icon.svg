      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M13.5 14.5 C15 14.5 15.8 15.5 15.8 16.8 C15.8 18 15 18.8 13.5 18.8 C12.5 18.8 12.2 18 12.2 16.8 C12.2 15.5 12.5 14.5 13.5 14.5 Z"
      stroke="#FFD54F"
      stroke-width="1.5"
      stroke-linecap="round"
